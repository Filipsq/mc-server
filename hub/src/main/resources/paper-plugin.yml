name: MchostingHub
version: '${version}'
main: pl.mchosting.server.hub.HubPlugin
api-version: '26.3'
description: Hub sieci mchosting.pl
authors: [mchosting.pl]
dependencies:
  server:
    MchostingCore:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  mchosting.hub.build:
    description: Budowanie i przesuwanie przedmiotów w hubie
    default: op
  mchosting.hub.admin:
    description: Ustawianie punktów w dolinie (/hubadmin)
    default: op
