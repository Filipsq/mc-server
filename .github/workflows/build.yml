name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      # build = compile (warnings are errors) + tests + spotlessCheck (formatting)
      - run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: pluginy
          path: |
            core/build/libs/*.jar
            hub/build/libs/*.jar
            minigry/build/libs/*.jar
